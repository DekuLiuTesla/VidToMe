work_dir: "workdir/sceneflow"

data:
  scene_type: "sceneflow"  # 'sceneflow' or ...
  height: 512
  width: 960
  data_dir: "data/sceneflow"
  fps: 15

generation:
  prompt_upsampler_ckpt: "/data2/yang_liu/Cosmos/checkpoints/Pixtral-12B"
  negative_prompt: "lowres, bad anatomy, bad hands, cropped, digital rendering, 3D rendering, computer rendering, virtual, worst quality"
  prompt:
    15mm_bk_left_noise_same_corr_2: "street, modern cars, distant woods, and mountains" 

  # VidToMe args. See details in "src/vidtome/patch.py, apply_patch()"
  local_merge_ratio: 0.9
  global_merge_ratio: 0.8
  frame_range: [0, 300, 1] # start, end, interval. == [0, 32] == [32]

  noise_mode: "same"

  correlate_noise: 
    apply: True
    alpha: 0.2

seed: 123
base_config: plugin/VidToMe/configs/iclight_default.yaml